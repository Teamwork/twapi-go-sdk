name: Test
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Build from source with the toolchain resolved from go.mod, so the
          # Go version golangci-lint is built with can never lag the module's
          # go directive. A prebuilt binary is built with whatever Go its
          # release used, and golangci-lint refuses to run when that is older
          # than the go directive. `goinstall` requires a full patch version.
          install-mode: goinstall
          version: v2.13.1

  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify generated code is up to date
        run: |
          go generate ./...
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Generated code is out of date. Run 'go generate ./...' locally and commit the result."
            echo "Files changed or created by 'go generate':"
            git status --short
            echo
            echo "Diff:"
            git --no-pager diff
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -v  ./...
        env:
          TWAPI_SERVER: https://tw-test-eu.rafael.net.br
          TWAPI_TOKEN: ${{ secrets.TWAPI_TOKEN }}