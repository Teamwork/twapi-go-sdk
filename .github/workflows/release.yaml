name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: auto derives it from the changes since the last tag"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Report the version that would be released, without tagging or releasing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # version resolves the tag being released, from either entry point: a tag
  # pushed by hand, or a dispatch that computes the next semantic version and
  # creates the tag itself. The dispatch path cannot hand off to the push path —
  # a tag created with GITHUB_TOKEN does not trigger `on: push: tags` — so the
  # release job below runs off this job's outputs instead of the ref.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version || steps.compute.outputs.version }}
      previous_tag: ${{ steps.tag.outputs.previous_tag || steps.compute.outputs.previous_tag }}
      sha: ${{ github.sha }}
      release: ${{ steps.tag.outputs.release || steps.compute.outputs.release }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Guard the release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "::error::Releases are cut from ${DEFAULT_BRANCH}; this run is on ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Version from tag
        id: tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          version="${GITHUB_REF#refs/tags/}"
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF}^" || echo "")"

          {
            echo "version=$version"
            echo "previous_tag=$previous"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compute version
        id: compute
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Appends version, previous_tag, bump and unclassified to
          # $GITHUB_OUTPUT, and a per-change table to the run summary. A change
          # whose title carries no known prefix counts as a patch and is flagged
          # there, as is a breaking change, which ships as a minor because v2
          # needs the /v2 module path.
          go run ./cmd/next-version -bump="$BUMP"

          if [ "$DRY_RUN" = "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: github.event_name == 'workflow_dispatch' && steps.compute.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -euo pipefail

          # Annotated, so the tag records who cut the release and when.
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${VERSION}" \
            -f message="${VERSION}" \
            -f object="${GITHUB_SHA}" \
            -f type=commit \
            --jq '.sha')"

          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="${tag_sha}"

          echo "::notice::Tagged ${VERSION} at ${GITHUB_SHA}"

  release:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.release == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}

      - name: Create Release
        run: |
          version="${{ needs.version.outputs.version }}"
          gh release create $version \
            --fail-on-no-commits \
            --generate-notes \
            ${{ needs.version.outputs.previous_tag != '' && format('--notes-start-tag {0}', needs.version.outputs.previous_tag) || '' }} \
            --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
